<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000" font-family="ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', sans-serif">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="35%" r="90%">
      <stop offset="0%" stop-color="#1F2D24"/>
      <stop offset="60%" stop-color="#152019"/>
      <stop offset="100%" stop-color="#0E1611"/>
    </radialGradient>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" seed="3"/>
      <feColorMatrix values="0 0 0 0 0.58  0 0 0 0 0.63  0 0 0 0 0.5  0 0 0 0.06 0"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M2,1 L11,6 L2,11" fill="none" stroke="#93A07F" stroke-opacity="0.7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M2,1 L11,6 L2,11" fill="none" stroke="#93A07F" stroke-opacity="0.5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .box-bg { fill: rgba(255,255,255,0.025); stroke: rgba(147,160,127,0.22); stroke-width: 1; }
      .box-bg-accent { fill: rgba(147,160,127,0.05); stroke: rgba(147,160,127,0.35); stroke-width: 1; }
      .layer-label { font-size: 11px; font-weight: 600; letter-spacing: 0.18em; fill: #93A07F; }
      .box-title { font-family: Georgia, 'Times New Roman', serif; font-weight: 400; font-size: 26px; letter-spacing: -0.01em; fill: #F4EFE3; }
      .box-subtitle { font-size: 14px; fill: rgba(244,239,227,0.68); font-weight: 400; }
      .box-detail { font-size: 13px; fill: rgba(244,239,227,0.52); }
      .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; fill: #B8C4A7; }
      .pill-text { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; fill: #B8C4A7; letter-spacing: 0.02em; }
      .connection-label { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; fill: rgba(147,160,127,0.85); letter-spacing: 0.04em; }
      .connection-line { stroke: rgba(147,160,127,0.45); stroke-width: 1.5; fill: none; }
      .connection-line-dashed { stroke: rgba(147,160,127,0.45); stroke-width: 1.3; stroke-dasharray: 5 4; fill: none; }
      .tool-item { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 13px; fill: rgba(244,239,227,0.78); }
      .header-eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.22em; fill: rgba(147,160,127,0.85); }
      .header-title { font-family: Georgia, 'Times New Roman', serif; font-size: 22px; fill: rgba(244,239,227,0.92); font-weight: 400; letter-spacing: -0.01em; }
    </style>
  </defs>
  <rect width="1400" height="1000" fill="url(#bg-grad)"/>
  <rect width="1400" height="1000" filter="url(#grain)" opacity="0.45"/>
  <text x="80" y="60" class="header-eyebrow">SYSTEM ARCHITECTURE</text>
  <text x="80" y="90" class="header-title">LedgerAgent · Google Cloud Rapid Agent Hackathon · 2026</text>
  <g transform="translate(1100, 50)">
    <circle cx="6" cy="34" r="4" fill="#93A07F"/>
    <circle cx="6" cy="34" r="7" fill="none" stroke="#93A07F" stroke-opacity="0.35" stroke-width="1"/>
    <text x="20" y="38" class="pill-text" fill="#B8C4A7">LIVE · europe-west2</text>
  </g>
  <line x1="80" y1="115" x2="1320" y2="115" stroke="rgba(147,160,127,0.18)" stroke-width="1"/>
  <g transform="translate(0, 155)">
    <text x="80" y="20" class="layer-label">01 · INTERFACE</text>
    <text x="80" y="50" font-family="Georgia, serif" font-size="14" fill="rgba(244,239,227,0.42)" font-style="italic">What the user sees and types into.</text>
    <rect x="430" y="0" width="800" height="120" rx="14" class="box-bg"/>
    <g transform="translate(460, 24)">
      <circle cx="0" cy="0" r="4" fill="rgba(244,239,227,0.18)"/>
      <circle cx="14" cy="0" r="4" fill="rgba(244,239,227,0.18)"/>
      <circle cx="28" cy="0" r="4" fill="rgba(244,239,227,0.18)"/>
    </g>
    <text x="510" y="30" class="pill-text" fill="rgba(244,239,227,0.4)">ledger-agent-five.vercel.app</text>
    <text x="460" y="68" class="box-title">Landing page</text>
    <text x="460" y="95" class="box-subtitle">Static HTML · custom chat UI · streams agent reasoning live</text>
    <g transform="translate(1070, 50)">
      <rect x="0" y="0" width="120" height="22" rx="11" fill="rgba(147,160,127,0.12)" stroke="rgba(147,160,127,0.25)"/>
      <text x="60" y="15" class="pill-text" text-anchor="middle">Vercel</text>
      <rect x="0" y="32" width="120" height="22" rx="11" fill="rgba(147,160,127,0.12)" stroke="rgba(147,160,127,0.25)"/>
      <text x="60" y="47" class="pill-text" text-anchor="middle">Tailwind-free CSS</text>
    </g>
  </g>
  <g>
    <path d="M 830 275 L 830 350" class="connection-line" marker-end="url(#arrow)"/>
    <rect x="855" y="290" width="200" height="38" rx="8" fill="rgba(20,30,24,0.92)" stroke="rgba(147,160,127,0.25)"/>
    <text x="955" y="305" class="connection-label" text-anchor="middle">POST /chat</text>
    <text x="955" y="320" class="pill-text" text-anchor="middle" fill="rgba(244,239,227,0.5)">Server-Sent Events</text>
  </g>
  <g transform="translate(0, 360)">
    <text x="80" y="20" class="layer-label">02 · REASONING</text>
    <text x="80" y="50" font-family="Georgia, serif" font-size="14" fill="rgba(244,239,227,0.42)" font-style="italic">The brain. Plans. Decides. Acts.</text>
    <rect x="430" y="0" width="800" height="120" rx="14" class="box-bg-accent"/>
    <g transform="translate(485, 60)">
      <circle cx="0" cy="0" r="20" fill="none" stroke="rgba(147,160,127,0.6)" stroke-width="1.4"/>
      <circle cx="0" cy="0" r="13" fill="none" stroke="rgba(147,160,127,0.35)" stroke-width="1"/>
      <circle cx="0" cy="0" r="5" fill="rgba(147,160,127,0.7)"/>
    </g>
    <text x="525" y="55" class="box-title">Agent service</text>
    <text x="525" y="82" class="box-subtitle">Plans investigations · calls tools · reasons over results · streams answers</text>
    <text x="525" y="104" class="mono">FastAPI · google.adk.agents.LlmAgent · McpToolset</text>
    <g transform="translate(1070, 36)">
      <rect x="0" y="0" width="120" height="22" rx="11" fill="rgba(147,160,127,0.18)" stroke="rgba(147,160,127,0.35)"/>
      <text x="60" y="15" class="pill-text" text-anchor="middle" fill="#C8D2BC">Cloud Run</text>
      <rect x="0" y="30" width="120" height="22" rx="11" fill="rgba(147,160,127,0.18)" stroke="rgba(147,160,127,0.35)"/>
      <text x="60" y="45" class="pill-text" text-anchor="middle" fill="#C8D2BC">gemini-3.1-pro</text>
      <rect x="0" y="60" width="120" height="22" rx="11" fill="rgba(147,160,127,0.12)" stroke="rgba(147,160,127,0.25)"/>
      <text x="60" y="75" class="pill-text" text-anchor="middle">Vertex AI</text>
    </g>
  </g>
  <g>
    <path d="M 830 480 L 830 555" class="connection-line" marker-end="url(#arrow)"/>
    <rect x="855" y="494" width="220" height="38" rx="8" fill="rgba(20,30,24,0.92)" stroke="rgba(147,160,127,0.25)"/>
    <text x="965" y="509" class="connection-label" text-anchor="middle">Model Context Protocol</text>
    <text x="965" y="524" class="pill-text" text-anchor="middle" fill="rgba(244,239,227,0.5)">StreamableHTTP transport</text>
  </g>
  <g transform="translate(0, 565)">
    <text x="80" y="20" class="layer-label">03 · TOOLS</text>
    <text x="80" y="50" font-family="Georgia, serif" font-size="14" fill="rgba(244,239,227,0.42)" font-style="italic">What the agent can do.</text>
    <text x="80" y="68" font-family="Georgia, serif" font-size="14" fill="rgba(244,239,227,0.42)" font-style="italic">Custom-built, shipped solo.</text>
    <rect x="430" y="0" width="800" height="200" rx="14" class="box-bg"/>
    <text x="460" y="40" class="layer-label" fill="#93A07F">CUSTOM MCP SERVER</text>
    <text x="460" y="75" class="box-title">LedgerAgent <tspan font-style="italic">MCP</tspan></text>
    <text x="460" y="100" class="box-subtitle">Python · FastMCP · 5 tools, two of them write operations</text>
    <g transform="translate(460, 130)">
      <g><circle cx="5" cy="6" r="2" fill="#93A07F"/><text x="16" y="10" class="tool-item">query_recent_transactions</text></g>
      <g transform="translate(0, 22)"><circle cx="5" cy="6" r="2" fill="#93A07F"/><text x="16" y="10" class="tool-item">find_duplicate_transactions</text></g>
      <g transform="translate(0, 44)"><circle cx="5" cy="6" r="2" fill="#93A07F"/><text x="16" y="10" class="tool-item">analyze_revenue_concentration</text></g>
      <g transform="translate(390, 0)"><circle cx="5" cy="6" r="2" fill="#C97B5C"/><text x="16" y="10" class="tool-item">get_pipeline_status</text></g>
      <g transform="translate(390, 22)"><circle cx="5" cy="6" r="2" fill="#C97B5C"/><text x="16" y="10" class="tool-item">trigger_sync   <tspan fill="rgba(201,123,92,0.7)" font-size="11">write</tspan></text></g>
      <text x="0" y="80" class="mono" fill="rgba(244,239,227,0.4)">query · operate</text>
    </g>
    <g transform="translate(1070, 36)">
      <rect x="0" y="0" width="120" height="22" rx="11" fill="rgba(147,160,127,0.12)" stroke="rgba(147,160,127,0.25)"/>
      <text x="60" y="15" class="pill-text" text-anchor="middle">Cloud Run</text>
      <rect x="0" y="30" width="120" height="22" rx="11" fill="rgba(147,160,127,0.12)" stroke="rgba(147,160,127,0.25)"/>
      <text x="60" y="45" class="pill-text" text-anchor="middle">Python 3.11</text>
      <rect x="0" y="60" width="120" height="22" rx="11" fill="rgba(147,160,127,0.12)" stroke="rgba(147,160,127,0.25)"/>
      <text x="60" y="75" class="pill-text" text-anchor="middle">FastMCP</text>
      <rect x="0" y="90" width="120" height="22" rx="11" fill="rgba(147,160,127,0.12)" stroke="rgba(147,160,127,0.25)"/>
      <text x="60" y="105" class="pill-text" text-anchor="middle">Secret Manager</text>
    </g>
  </g>
  <g>
    <path d="M 600 765 L 600 800 L 400 800 L 400 845" class="connection-line" marker-end="url(#arrow)"/>
    <text x="490" y="788" class="connection-label" text-anchor="middle">SQL</text>
    <path d="M 1060 765 L 1060 800 L 1000 800 L 1000 845" class="connection-line" marker-end="url(#arrow)"/>
    <text x="1100" y="788" class="connection-label" text-anchor="middle">REST API</text>
  </g>
  <g transform="translate(0, 855)">
    <text x="80" y="20" class="layer-label">04 · DATA</text>
    <text x="80" y="50" font-family="Georgia, serif" font-size="14" fill="rgba(244,239,227,0.42)" font-style="italic">Source of truth.</text>
    <g transform="translate(230, 0)">
      <rect x="0" y="0" width="370" height="100" rx="12" class="box-bg"/>
      <g transform="translate(30, 30)" stroke="rgba(147,160,127,0.55)" stroke-width="1.2" fill="none">
        <ellipse cx="0" cy="0" rx="14" ry="5"/>
        <path d="M -14,0 L -14,28"/>
        <path d="M 14,0 L 14,28"/>
        <ellipse cx="0" cy="28" rx="14" ry="5" fill="rgba(147,160,127,0.08)"/>
        <ellipse cx="0" cy="14" rx="14" ry="5" stroke-opacity="0.5"/>
      </g>
      <text x="65" y="38" class="box-title" font-size="22">BigQuery</text>
      <text x="65" y="64" class="mono">ledger_demo.transactions</text>
      <text x="65" y="84" class="box-detail">60 rows · europe-west2 · Maya's books, April–May 2026</text>
    </g>
    <g transform="translate(820, 0)">
      <rect x="0" y="0" width="370" height="100" rx="12" class="box-bg"/>
      <g transform="translate(30, 30)" fill="rgba(147,160,127,0.7)">
        <path d="M 4,0 L -4,16 L 2,16 L -2,28 L 8,12 L 2,12 Z"/>
      </g>
      <text x="65" y="38" class="box-title" font-size="22">Fivetran</text>
      <text x="65" y="64" class="mono">Google Sheets → BigQuery</text>
      <text x="65" y="84" class="box-detail">Scheduled sync · 1 connection · auto-refresh</text>
    </g>
    <path d="M 820 50 L 600 50" class="connection-line-dashed" marker-end="url(#arrow-dashed)"/>
    <text x="710" y="44" class="pill-text" text-anchor="middle" fill="rgba(147,160,127,0.6)" font-size="10">data flow · scheduled</text>
  </g>
  <g transform="translate(0, 970)">
    <line x1="80" y1="0" x2="1320" y2="0" stroke="rgba(147,160,127,0.12)" stroke-width="1"/>
    <text x="80" y="22" class="pill-text" fill="rgba(244,239,227,0.4)">Built solo · Ali Qureshi · github.com/ali-qureshi07/ledger-agent</text>
    <text x="1320" y="22" class="pill-text" fill="rgba(244,239,227,0.4)" text-anchor="end">All boxes are real deployments. No mocks.</text>
  </g>
</svg>
